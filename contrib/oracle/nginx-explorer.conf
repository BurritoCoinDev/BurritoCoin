# explorer.burritoco.in — nginx reverse proxy in front of btc-rpc-explorer (:3002).
# Sits behind Cloudflare's proxy (orange cloud). Plain HTTP on :80 works with
# Cloudflare SSL mode "Flexible"; for "Full", add a listen 443 block with a free
# Cloudflare Origin certificate.
# Install: sudo cp nginx-explorer.conf /etc/nginx/sites-available/explorer
#          sudo ln -s /etc/nginx/sites-available/explorer /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name explorer.burritoco.in;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
